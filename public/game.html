<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NFL Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./splash.css" />
</head>
<body class="scorebug">

<div id="loading-state">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading scoreboard…</div>
</div>

<div id="scorebug-content" style="display:none">
  <div class="scorebug-header">
    <div class="scorebug-top">
      <div class="meta-strip">
        <div class="venue" id="venue-info"></div>
        <div class="game-context" id="game-context"></div>
      </div>
      <div class="score-row">
        <div class="team">
          <span class="team-logo" id="away-logo-holder"></span>
          <div class="team-info">
            <span class="team-name" id="away-name"></span>
            <span class="team-record" id="away-record"></span>
          </div>
        </div>
        <div class="status-block">
          <span class="status-score" id="away-score">0</span>
          <div class="status-center">
            <span class="status-badge" id="status-badge"></span>
            <span class="status-inning" id="inning-info"></span>
            <span class="status-count" id="status-count"><span id="poss-text"></span></span>
          </div>
          <span class="status-score" id="home-score">0</span>
        </div>
        <div class="team">
          <span class="team-logo" id="home-logo-holder"></span>
          <div class="team-info">
            <span class="team-name" id="home-name"></span>
            <span class="team-record" id="home-record"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="linescore"><div id="linescore-container"></div></div>
  </div>

  <!-- Dynamic first tab: MATCHUP -> LIVE -> WRAP -->
  <div class="tab-content tab-content-active" id="tab-game">
    <div class="state-pane" id="pregame-content" style="display:none">
      <div id="pregame-body"></div>
    </div>
    <div class="state-pane" id="live-content" style="display:none">
      <div class="drive-hdr" id="drive-hdr" style="display:none">
        <span class="dh-logo" id="dh-logo"></span>
        <span style="flex:1">
          <span class="dh-title">CURRENT DRIVE</span><br>
          <span class="dh-meta" id="dh-meta"></span>
        </span>
        <button class="replay-btn" id="replay-play-btn" type="button" aria-label="Replay last play">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 8 8 8"/></svg>
        </button>
      </div>
      <div class="play-banner" id="penalty-pill"></div>
      <div class="situation-strip" id="situation" style="display:none">
        <span class="sit-col"><span class="sit-k">DOWN</span><span class="sit-v" id="sit-dd">—</span></span>
        <span class="sit-div"></span>
        <span class="sit-col"><span class="sit-k">BALL ON</span><span class="sit-v" id="sit-spot">—</span></span>
      </div>
      <div class="fieldwrap">
        <svg class="field-svg" id="field-svg" viewBox="0 -16 600 118" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="yardnums" id="yard-nums"></div>
      </div>
      <div class="lastplay" id="last-play" style="display:none"></div>
    </div>
    <div class="state-pane" id="final-content" style="display:none">
      <div id="final-body"></div>
    </div>
    <div class="state-pane" id="postponed-content" style="display:none">
      <div id="postponed-body"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="tab-content" id="tab-box"></div>

  <!-- PLAYS -->
  <div class="tab-plays-wrap tab-content" id="tab-plays">
    <div class="plays-toggle" id="plays-toggle" data-active="scoring">
      <button class="plays-seg is-active" data-plays="scoring" type="button">Scoring</button>
      <button class="plays-seg" data-plays="all" type="button">Drives</button>
    </div>
    <div id="scoring-plays-list"></div>
    <div id="all-plays-list" hidden></div>
    <div id="plays-clips"></div>
  </div>

  <!-- WIN PROB -->
  <div class="tab-content" id="tab-winprob"></div>

  <!-- STANDINGS -->
  <div class="tab-content" id="tab-standings">
    <div class="stand-nav" id="stand-nav" data-active="AFC">
      <button class="stand-seg is-active" data-league="AFC" type="button">AFC</button>
      <button class="stand-seg" data-league="NFC" type="button">NFC</button>
    </div>
    <div id="stand-body"></div>
  </div>

  <nav class="tab-bar">
    <button class="tab tab-active" data-tab="game" type="button"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.45635 6.45637C8.583 4.32971 11.5287 3.57849 14.2767 3.44059C16.8147 3.31323 19.0625 3.71611 20.0701 3.92988C20.2838 4.93738 20.6864 7.18553 20.5588 9.72381C20.4208 12.4721 19.6695 15.4178 17.5436 17.5437C15.4178 19.6695 12.4721 20.4208 9.72381 20.5588C7.18553 20.6864 4.93738 20.2838 3.92989 20.0701C3.71611 19.0625 3.31323 16.8147 3.44059 14.2767C3.57848 11.5287 4.32969 8.58304 6.45635 6.45637ZM20.7172 2.02387C19.7764 1.81449 17.1751 1.29263 14.1765 1.4431C11.1898 1.59298 7.66622 2.41805 5.04213 5.04216C2.41804 7.66627 1.59297 11.1898 1.4431 14.1765C1.29263 17.1751 1.81449 19.7764 2.02387 20.7172C2.07994 20.9691 2.19242 21.2809 2.45576 21.5442C2.7191 21.8076 3.03083 21.92 3.28275 21.9761C4.22374 22.1855 6.82539 22.707 9.82416 22.5563C12.8109 22.4063 16.3345 21.5813 18.9579 18.9579C21.5812 16.3345 22.4063 12.8109 22.5563 9.82417C22.707 6.82539 22.1855 4.22373 21.9761 3.28274C21.92 3.03081 21.8076 2.71908 21.5442 2.45574C21.2809 2.1924 20.9691 2.07993 20.7172 2.02387ZM16.2071 9.20715C16.5976 8.81662 16.5976 8.18346 16.2071 7.79294C15.8166 7.40241 15.1834 7.40241 14.7929 7.79294L13.5 9.08583L12.7071 8.29294C12.3166 7.90241 11.6834 7.90241 11.2929 8.29294C10.9024 8.68346 10.9024 9.31662 11.2929 9.70715L12.0858 10.5L10.5 12.0858L9.70709 11.2929C9.31657 10.9024 8.6834 10.9024 8.29288 11.2929C7.90235 11.6835 7.90235 12.3166 8.29288 12.7071L9.08577 13.5L7.79288 14.7929C7.40235 15.1835 7.40235 15.8166 7.79288 16.2071C8.1834 16.5977 8.81657 16.5977 9.20709 16.2071L10.5 14.9143L11.2929 15.7071C11.6834 16.0977 12.3166 16.0977 12.7071 15.7071C13.0976 15.3166 13.0976 14.6835 12.7071 14.2929L11.9142 13.5L13.5 11.9143L14.2929 12.7071C14.6834 13.0977 15.3166 13.0977 15.7071 12.7071C16.0976 12.3166 16.0976 11.6835 15.7071 11.2929L14.9142 10.5L16.2071 9.20715Z" fill="currentColor"/></svg><span id="dynamic-tab-label">GAME</span></button>
    <button class="tab" data-tab="box" type="button"><svg viewBox="0 -0.5 21 21" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs></defs><g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><g id="Dribbble-Light-Preview" transform="translate(-219.000000, -840.000000)" fill="currentColor"><g id="icons" transform="translate(56.000000, 160.000000)"><path d="M179.8,698 L181.9,698 L181.9,682 L179.8,682 L179.8,698 Z M177.7,700 L184,700 L184,680 L177.7,680 L177.7,700 Z M172.45,698 L174.55,698 L174.55,686 L172.45,686 L172.45,698 Z M170.35,700 L176.65,700 L176.65,684 L170.35,684 L170.35,700 Z M165.1,698 L167.2,698 L167.2,692 L165.1,692 L165.1,698 Z M163,700 L169.3,700 L169.3,690 L163,690 L163,700 Z" id="stats-[#1366]"></path></g></g></g></svg><span>STATS</span></button>
    <button class="tab" data-tab="plays" type="button"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 1H1V3H3V1Z" fill="currentColor"/><path d="M3 5H1V7H3V5Z" fill="currentColor"/><path d="M1 9H3V11H1V9Z" fill="currentColor"/><path d="M3 13H1V15H3V13Z" fill="currentColor"/><path d="M15 1H5V3H15V1Z" fill="currentColor"/><path d="M15 5H5V7H15V5Z" fill="currentColor"/><path d="M5 9H15V11H5V9Z" fill="currentColor"/><path d="M15 13H5V15H15V13Z" fill="currentColor"/></svg><span>PLAYS</span></button>
    <button class="tab" data-tab="winprob" type="button"><svg viewBox="0 0 24 24" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"><defs><style>.cls-1{fill:none;stroke:currentColor;stroke-miterlimit:10;stroke-width:1.91px;}</style></defs><polyline class="cls-1" points="23.5 22.5 1.5 22.5 1.5 17.55 1.5 0.5"/><polyline class="cls-1" points="22.54 3.37 12.98 12.94 9.15 9.11 1.5 16.76"/><polyline class="cls-1" points="17.76 3.37 22.54 3.37 22.54 8.15"/></svg><span>WIN PROB</span></button>
    <button class="tab" data-tab="standings" type="button"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M32,160V456a8,8,0,0,0,8,8H176V160a16,16,0,0,0-16-16H48A16,16,0,0,0,32,160Z" style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px"/><path d="M320,48H192a16,16,0,0,0-16,16V464H336V64A16,16,0,0,0,320,48Z" style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px"/><path d="M464,208H352a16,16,0,0,0-16,16V464H472a8,8,0,0,0,8-8V224A16,16,0,0,0,464,208Z" style="fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px"/></svg><span>STANDINGS</span></button>
  </nav>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
